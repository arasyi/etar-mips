name: wfiot_static
output_dir: results/wfiot_static
seed: 123
k: 10
ground_truth_k: 100
stages: [env, data, online, analyze, tables]
limits:
  n: 50000
  q: 1000

datasets:
  items:
    - name: wfiot_synthetic
      source: generated_sweep
      kinds: [dense_gaussian, sparse10, mixed_dropout_heavytail, norm_heavy]
      n_values: [50000]
      d_values: [256]
      queries: 1000
      seeds: [123]
    - name: sift
      source: hdf5
      path: data/ann/sift-128-euclidean.hdf5
      limit_n: 50000
      limit_q: 1000
    - name: glove
      source: hdf5
      path: data/ann/glove-100-angular.hdf5
      limit_n: 50000
      limit_q: 1000
    - name: lastfm
      source: hdf5
      path: data/ann/lastfm-64-dot.hdf5
      limit_n: 50000
      limit_q: 1000
    - name: fashion_mnist
      source: hdf5
      path: data/ann/fashion-mnist-784-euclidean.hdf5
      limit_n: 50000
      limit_q: 1000
    - name: nytimes
      source: hdf5
      path: data/ann/nytimes-256-angular.hdf5
      limit_n: 50000
      limit_q: 1000

benchmarks:
  methods:
    - name: exact_f32
      family: etar
      method: exact_f32
      backend: auto
      modes: [online]

    - name: full_i8_scan
      family: etar
      method: full_i8
      backend: cpp
      storage_backend: cpp
      store_float32: false
      rerank_dtype: int8
      scan_dtype: int8
      scan_quantization: row
      scan_layout: column
      r: 10
      rerank: false
      storage_preset: "8-shared"
      query_mode: int8
      modes: [online]

    - &etar_rho_r
      name: etar_8p32_sweep
      family: etar
      method: etar
      backend: cpp
      storage_backend: cpp
      storage_preset: "8+32"
      store_residuals: false
      scan_dtype: int8
      scan_quantization: row
      scan_layout: column
      scan_insert_policy: auto
      head_policy: energy
      tail_policy: derived
      rerank: true
      r: [50, 100, 200]
      rho: [0.80, 0.90, 0.96]
      h_max: 128
      lambda_tail: 0.75
      alpha_min: 0.05
      alpha_max: 0.5
      query_mode: float
      modes: [online]

    - <<: *etar_rho_r
      name: etar_8p8
      storage_preset: "8+8"
      rerank_dtype: int8
      rerank_query_mode: float
      r: 100
      rho: 0.90

    - <<: *etar_rho_r
      name: etar_8p32_tail_none
      tail_policy: none
      r: 100
      rho: 0.90

    - <<: *etar_rho_r
      name: etar_8p32_tail_fixed
      tail_policy: fixed
      alpha_tail_fixed: 0.10
      r: 100
      rho: 0.90

    - <<: *etar_rho_r
      name: etar_8p32_no_rerank
      tail_policy: derived
      rerank: false
      r: 10
      rho: 0.90

    - name: faiss_hnsw
      family: faiss
      index: hnsw
      M: 32
      ef_search: 128
      modes: [online]

    - name: hnswlib
      family: hnswlib
      M: 32
      ef_construction: 200
      ef_search: 512
      modes: [online]

    - name: faiss_ivf
      family: faiss
      index: ivf
      nlist: 512
      nprobe: 256
      modes: [online]

    - name: annoy
      family: annoy
      trees: 100
      search_k: 10000
      modes: [online]

    - name: scann
      family: scann
      leaves: 1000
      leaves_to_search: 1000
      reorder: 5000
      modes: [online]

dynamic:
  enabled: false
