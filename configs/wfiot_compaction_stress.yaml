name: wfiot_compaction_stress
output_dir: results/wfiot_compaction_stress
seed: 123
k: 10
stages: [dynamic]

dynamic:
  enabled: true
  workloads:
    - name: high_churn_compaction
      type: mixed
      regime: norm_heavy
      initial_n: 50000
      stream_n: 20000
      d: 256
      queries: 1000
      steps: 20000
      seed: 501
      recall_every: 500
      eval_after_events: [insert, update, delete, compact, rebuild]
      eval_every_mutations: 500
      eval_query_count: 25
      eval_query_seed: 1501
      operation_mix: {query: 0.40, insert: 0.15, update: 0.15, delete: 0.30}
      victim_policy: random
      k: 10
      etar:
        backend: cpp
        storage_backend: cpp
        storage_preset: "8+32"
        store_residuals: false
        method: etar
        scan_dtype: int8
        scan_quantization: row
        scan_layout: column
        scan_insert_policy: auto
        r: 100
        rho: 0.96
        h_max: 128
        lambda_tail: 0.75
        alpha_min: 0.05
        alpha_max: 0.5
        query_mode: float
        omega_update_policy: exact_live
        compact_every: 0
        compact_on_delete: true
        compact_tombstone_fraction: 0.10
        compact_min_tombstones: 1024
      methods:
        - name: etar_8p32
        - name: etar_8p8
          storage_preset: "8+8"
          rerank_dtype: int8
          rerank_query_mode: float
        - name: faiss_hnsw
          M: 32
          ef_search: 128
          overfetch: 10
          rebuild_after_mutations: 500
        - name: hnswlib
          M: 32
          ef_construction: 200
          ef_search: 512
        - name: faiss_ivf
          nlist: 512
          nprobe: 256
          overfetch: 10
          rebuild_after_mutations: 500
