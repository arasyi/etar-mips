plugins {
    id "com.android.application"
}

android {
    namespace "ae.kunet.etarbenchmark"
    compileSdk 35
    ndkVersion "27.2.12479018"

    defaultConfig {
        applicationId "ae.kunet.etarbenchmark"
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName "0.2.0"

        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        benchmark {
            initWith release
            matchingFallbacks = ["release"]
            debuggable false
            jniDebuggable false
            minifyEnabled false
            // Installable from CI without managing a publication key. This APK
            // is a research instrument, not a Play Store release.
            signingConfig signingConfigs.debug
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }
}

dependencies {
    implementation "androidx.core:core:1.15.0"
}
